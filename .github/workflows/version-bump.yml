name: Version Bump

# Bumps the version and pushes the release tag. The tag is what release.yml
# listens for, so `create_tag: true` here is a real, public release.
#
# Requires a RELEASE_TOKEN repository secret: a fine-grained PAT with
# "Contents: read and write" on this repository. A tag pushed with the default
# GITHUB_TOKEN does NOT trigger release.yml (GitHub suppresses workflow runs
# caused by GITHUB_TOKEN), so the token is mandatory rather than cosmetic.

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version type to bump'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      create_tag:
        description: 'Push the release tag (triggers release.yml: build, GitHub Release, publish)'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest

    steps:
      - name: Check for the release token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::Repository secret RELEASE_TOKEN is not set. Without it the tag would be pushed with GITHUB_TOKEN, which never triggers release.yml. Add a fine-grained PAT with 'Contents: read and write' on this repository as RELEASE_TOKEN."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0  # tags are needed to list the commits since the last release
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        run: |
          CURRENT="$(node -p "require('./package.json').version")"
          npm version "${{ inputs.version_type }}" --no-git-tag-version
          NEW="$(node -p "require('./package.json').version")"
          # `npm version --no-git-tag-version` only rewrites package.json; this
          # keeps both version fields in package-lock.json in sync.
          npm install --package-lock-only --no-audit --no-fund
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"

      - name: Build extension
        run: npm run compile

      - name: Update CHANGELOG.md
        id: changelog
        run: |
          VERSION="${{ steps.bump.outputs.new }}"
          if grep -q "^## \[v$VERSION\]" CHANGELOG.md; then
            echo "source=hand-written entry already in CHANGELOG.md" >> "$GITHUB_OUTPUT"
          else
            LAST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
            ENTRY="$(mktemp)"
            {
              echo "## [v$VERSION] - $(date -u +%F)"
              echo
              echo "### Changes"
              if [ -n "$LAST_TAG" ]; then
                git log --no-merges --pretty=format:'- %s (%h)' "$LAST_TAG..HEAD"
              else
                git log --no-merges -n 20 --pretty=format:'- %s (%h)'
              fi
              echo
              echo
            } > "$ENTRY"
            # Insert the new section above the previous top entry, after the
            # file's preamble.
            awk -v entry="$ENTRY" '
              !done && /^## \[/ {
                while ((getline line < entry) > 0) print line
                close(entry)
                done = 1
              }
              { print }
            ' CHANGELOG.md > CHANGELOG.new
            mv CHANGELOG.new CHANGELOG.md
            rm -f "$ENTRY"
            echo "source=generated from commits since ${LAST_TAG:-the first commit}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the changelog entry resolves
        run: |
          VERSION="${{ steps.bump.outputs.new }}"
          NOTES="$(awk -v ver="## [v$VERSION]" '
            index($0, ver) == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | tr -d '[:space:]')"
          if [ -z "$NOTES" ]; then
            echo "::error::No usable CHANGELOG.md section for v$VERSION; release.yml would publish an empty release body."
            exit 1
          fi

      - name: Commit and push
        run: |
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore(release): v${{ steps.bump.outputs.new }}"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Push the release tag
        if: inputs.create_tag
        run: |
          VERSION="${{ steps.bump.outputs.new }}"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"

      - name: Summary
        run: |
          {
            echo "### v${{ steps.bump.outputs.current }} → v${{ steps.bump.outputs.new }}"
            echo
            echo "- Changelog section: ${{ steps.changelog.outputs.source }}"
            echo "- Tag pushed: ${{ inputs.create_tag }}"
            if [ "${{ inputs.create_tag }}" = "true" ]; then
              echo "- \`release.yml\` now builds the VSIX, creates the GitHub Release and publishes to the Marketplace and Open VSX"
            else
              echo "- Version bumped only; no tag pushed and nothing published"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
