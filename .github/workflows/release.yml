name: Release Extension

on:
  push:
    tags:
      - 'v*.*.*'  # e.g. v2.0.2 — pushing one of these tags is what publishes

permissions:
  contents: write  # create the GitHub Release and attach the VSIX to it

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run compile  # webpack + ts-loader with full typecheck

      - name: Resolve version and artifact name
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$VERSION does not match the version in package.json ($PKG_VERSION)"
            exit 1
          fi
          NAME="$(node -p "require('./package.json').name")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "vsix=$NAME-$VERSION.vsix" >> "$GITHUB_OUTPUT"

      - name: Package extension
        run: npm run package

      - name: Verify the VSIX was produced
        run: |
          VSIX="${{ steps.version.outputs.vsix }}"
          if [ ! -f "$VSIX" ]; then
            echo "::error::npm run package did not produce $VSIX"
            ls -l ./*.vsix || true
            exit 1
          fi
          ls -l "$VSIX"

      - name: Get changelog entry
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NOTES="$(awk -v ver="## [v$VERSION]" '
            index($0, ver) == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)"
          if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            NOTES="_No CHANGELOG.md entry found for v$VERSION._"
          fi
          {
            echo "CHANGELOG<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref }}
          name: GitHub Desktop Plus v${{ steps.version.outputs.version }}
          body: |
            ${{ steps.changelog.outputs.CHANGELOG }}

            ## Installation

            ### From the VSIX file
            1. Download `${{ steps.version.outputs.vsix }}` from the assets below
            2. In VS Code, open the Extensions view (`Ctrl+Shift+X`)
            3. Open the "..." menu and choose "Install from VSIX...", then pick the downloaded file

            ### From the command line
            ```bash
            code --install-extension ${{ steps.version.outputs.vsix }}
            ```

            ### From a registry
            - VS Code Marketplace: [`piotroszko.github-desktop-plus`](https://marketplace.visualstudio.com/items?itemName=piotroszko.github-desktop-plus)
            - Open VSX (VSCodium, Cursor, Theia): [`piotroszko.github-desktop-plus`](https://open-vsx.org/extension/piotroszko/github-desktop-plus)

            ## Requirements
            - VS Code 1.84.0 or higher
            - Git installed and available in `PATH`
            - A GitHub account for the account-backed features

            ---
            GitHub Desktop Plus is a fork of
            [vscode-github-desktop](https://github.com/betaversionio/github-desktop)
            by BetaVersion. Reports about this fork belong in
            [this repository](https://github.com/piotroszko/github-desktop-plus);
            the upstream project is linked for attribution only.
          files: ${{ steps.version.outputs.vsix }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::Repository secret VSCE_PAT is not set, so nothing was published to the VS Code Marketplace. Add an Azure DevOps PAT with the Marketplace 'Manage' scope as the VSCE_PAT repository secret and re-run this job."
            exit 1
          fi
          ./node_modules/.bin/vsce publish \
            --packagePath "${{ steps.version.outputs.vsix }}" \
            --pat "$VSCE_PAT" \
            --skip-duplicate
          echo "Published ${{ steps.version.outputs.vsix }} to the VS Code Marketplace"

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::error::Repository secret OVSX_PAT is not set, so nothing was published to Open VSX. Create the 'piotroszko' namespace on open-vsx.org, add an access token for it as the OVSX_PAT repository secret and re-run this job."
            exit 1
          fi
          ./node_modules/.bin/ovsx -p "$OVSX_PAT" publish \
            --packagePath "${{ steps.version.outputs.vsix }}" \
            --skip-duplicate
          echo "Published ${{ steps.version.outputs.vsix }} to Open VSX"
